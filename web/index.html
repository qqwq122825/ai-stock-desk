<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI 量化决策台</title>
<script src="/echarts.min.js"></script>
<script>window.echarts||document.write('<script src="https://lib.baomitu.com/echarts/5.4.3/echarts.min.js"><\/script>')</script>
<style>
:root{
  --bg:#0d1117;--panel:#151b23;--panel2:#1c2430;--line:#2a3442;--text:#e6edf3;--mute:#8b98a8;
  --up:#f0475a;--down:#1fbf75;--accent:#e9b949;--blue:#4c9aff;--warn:#ff9f43;
  --mono:"SF Mono",Menlo,Consolas,"Roboto Mono",monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
a{color:var(--blue)}
header{position:sticky;top:0;z-index:10;background:#0b0f14ee;backdrop-filter:blur(6px);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:14px;padding:10px 18px;flex-wrap:wrap}
.logo{font-weight:700;letter-spacing:.5px;font-size:16px}
.logo b{color:var(--accent)}
.pill{padding:2px 9px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);font-size:12px;color:var(--mute);white-space:nowrap}
.pill.on{color:var(--down);border-color:#1fbf7555}.pill.warn{color:var(--warn);border-color:#ff9f4366;cursor:pointer}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--mute);margin-right:5px;vertical-align:1px}
.dot.on{background:var(--down);box-shadow:0 0 6px var(--down)}
nav{display:flex;gap:2px;margin-left:auto;flex-wrap:wrap}
nav a{color:var(--mute);text-decoration:none;padding:6px 11px;border-radius:6px}
nav a.act,nav a:hover{color:var(--text);background:var(--panel2)}
main{padding:16px 18px;max-width:1500px;margin:0 auto}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.g21{grid-template-columns:2fr 1fr}
@media(max-width:900px){.g2,.g3,.g4,.g21{grid-template-columns:1fr}nav{margin-left:0}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;min-width:0}
.card h3{margin:0 0 10px;font-size:13px;color:var(--mute);font-weight:600;display:flex;align-items:center;gap:8px}
.card h3 .r{margin-left:auto}
.big{font:600 26px var(--mono)}
.num{font-family:var(--mono)}
.up{color:var(--up)}.down{color:var(--down)}.mute{color:var(--mute)}.acc{color:var(--accent)}
.kv{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.kv div{background:var(--panel2);border-radius:6px;padding:6px 8px}
.kv small{display:block;color:var(--mute);font-size:11px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{color:var(--mute);font-weight:500;font-size:12px}
td.n,th.n{text-align:right;font-family:var(--mono)}
tr.click{cursor:pointer}tr.click:hover td{background:var(--panel2)}
.scroll{overflow-x:auto}
button,.btn{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:5px 12px;cursor:pointer;font:inherit;font-size:13px}
button:hover{border-color:var(--mute)}
button.pri{background:var(--accent);color:#111;border-color:var(--accent);font-weight:600}
button.red{background:var(--up);border-color:var(--up);color:#fff}
button.grn{background:var(--down);border-color:var(--down);color:#fff}
button.sm{padding:2px 8px;font-size:12px}
input,select,textarea{background:#0b0f14;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:5px 8px;font:inherit;font-size:13px;min-width:0}
textarea{width:100%;font-family:var(--mono);font-size:12px}
label{font-size:12px;color:var(--mute)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.form{display:grid;grid-template-columns:150px 1fr;gap:8px 12px;align-items:center}
.form input[type=text],.form input[type=number],.form input[type=password],.form select{width:100%}
.form input[type=checkbox]{justify-self:start}
@media(max-width:600px){.kv{grid-template-columns:1fr 1fr}.form{grid-template-columns:110px 1fr}main{padding:12px}}
.tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:4px;background:var(--panel2);color:var(--mute);border:1px solid var(--line)}
.tag.buy{color:var(--up);border-color:#f0475a55}.tag.sell{color:var(--down);border-color:#1fbf7555}
.tag.ok{color:var(--down)}.tag.bad{color:var(--up)}.tag.wait{color:var(--warn);border-color:#ff9f4366}
.list>div{padding:8px 0;border-bottom:1px dashed var(--line)}
.list>div:last-child{border:0}
.chart{height:300px}
.empty{color:var(--mute);padding:18px;text-align:center}
.book{font-family:var(--mono);font-size:12px;width:100%}
.book td{padding:2px 6px;border:0}
.dec{border-left:3px solid var(--accent);padding:8px 12px;margin-bottom:12px;background:var(--panel2);border-radius:0 8px 8px 0}
.dec .view{margin:6px 0;white-space:pre-wrap}
pre{white-space:pre-wrap;word-break:break-all;font-size:11px;background:#0b0f14;padding:8px;border-radius:6px;max-height:420px;overflow:auto}
#toast{position:fixed;right:18px;bottom:18px;background:var(--panel2);border:1px solid var(--line);padding:10px 14px;border-radius:8px;display:none;max-width:420px;z-index:99}
.hidden{display:none}
.order{border:1px solid var(--warn);border-radius:8px;padding:10px;margin-bottom:10px;background:#ff9f430d}
.seg button{border-radius:0;margin-left:-1px}.seg button.act{background:var(--accent);color:#111;border-color:var(--accent)}
.seg button:first-child{border-radius:6px 0 0 6px}.seg button:last-child{border-radius:0 6px 6px 0}
.idx{display:flex;gap:18px;overflow-x:auto;padding-bottom:4px}
.idx div{white-space:nowrap}
</style>
</head>
<body>
<header>
  <div class="logo">AI <b>量化</b>决策台</div>
  <span class="pill" id="sess">--</span>
  <span class="pill" id="mon"><span class="dot"></span>监控</span>
  <span class="pill" id="aiacc">AI: --</span>
  <span class="pill warn hidden" id="pend" onclick="go('orders')">待确认 0</span>
  <nav id="nav">
    <a href="#dash">总览</a><a href="#watch">行情</a><a href="#screen">选股</a><a href="#committee">委员会</a><a href="#rules">规则预警</a><a href="#strategies">策略</a><a href="#backtest">回测</a>
    <a href="#ai">AI决策</a><a href="#orders">订单交易</a><a href="#settings">设置</a>
    <a href="javascript:logout()" title="退出登录">退出</a>
  </nav>
</header>
<main id="app"></main>
<div id="toast"></div>

<script>
const $=s=>document.querySelector(s);
const TOKEN=(()=>{const u=new URLSearchParams(location.search).get('token');try{if(u)localStorage.setItem('tk',u);return u||localStorage.getItem('tk')||''}catch(e){return u||''}})();
async function api(path,opt={}){
  const r=await fetch(path,{method:opt.method||'GET',headers:{'Content-Type':'application/json','X-Token':TOKEN},body:opt.body?JSON.stringify(opt.body):undefined});
  const j=await r.json().catch(()=>({error:'响应解析失败'}));
  if(r.status==401&&j.login){location.href='/login';throw new Error('需要登录')}
  if(!r.ok){toast('❌ '+(j.error||r.status));throw new Error(j.error)}
  return j;
}
const post=(p,b)=>api(p,{method:'POST',body:b||{}});
async function logout(){await fetch('/api/logout',{method:'POST'});location.href='/login'}
function toast(t){const e=$('#toast');e.innerHTML=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',4000)}
const f2=(x,d=2)=>x==null||isNaN(x)?'--':Number(x).toFixed(d);
const pc=x=>x==null?'':(x>0?'up':x<0?'down':'');
const sg=(x,d=2)=>x==null?'--':(x>0?'+':'')+f2(x,d);
const money=x=>x==null?'--':Number(x).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SIDE={buy:'<span class="tag buy">买入</span>',sell:'<span class="tag sell">卖出</span>',watch:'<span class="tag">关注</span>'};
const ST={pending_confirm:'<span class="tag wait">待确认</span>',confirmed:'<span class="tag wait">已确认待成交</span>',submitted:'<span class="tag wait">已报单</span>',filled:'<span class="tag ok">已成交</span>',rejected:'<span class="tag bad">拒绝</span>',expired:'<span class="tag">过期</span>',cancelled:'<span class="tag">取消</span>'};
let charts=[],timer=null,page='dash',stockSym=null,stockPeriod='day';
function go(p){location.hash=p}
function mkChart(el){const c=echarts.init(el,'dark',{renderer:'canvas'});charts.push(c);return c}
window.addEventListener('resize',()=>charts.forEach(c=>c.resize()));

// ---------- 状态栏 ----------
async function status(){
  try{
    const s=await api('/api/status');
    $('#sess').textContent=s.session+' '+s.now.slice(11,16);
    const on=s.last_loop&&(Date.now()/1000-s.last_loop<60);
    $('#mon').innerHTML=`<span class="dot ${on?'on':''}"></span>监控${on?'运行中 · '+s.symbols+'只':'未运行'}${s.last_error?' ⚠':''}`;
    $('#mon').title=s.last_error||'';
    $('#aiacc').textContent='AI作用: '+s.ai_accounts.map(a=>a=='paper'?'模拟盘':'实盘').join('+')+(s.llm_enabled?' · 内置模型✓':'');
    const p=$('#pend');p.textContent='待确认 '+s.pending;p.classList.toggle('hidden',!s.pending);
  }catch(e){}
}

// ---------- 总览 ----------
async function pageDash(first){
  const [ov,alerts,decs,pl]=await Promise.all([api('/api/overview'),api('/api/alerts?limit=12'),api('/api/decisions?limit=1'),api('/api/plans').catch(()=>({active:[]}))]);
  const acc=a=>{const s=ov.accounts[a];return `<div class="card"><h3>${s.name}${a=='paper'?' <span class="tag">虚拟资金</span>':' <span class="tag wait">真实资金·需确认</span>'}</h3>
    <div class="big">${money(s.equity)}</div>
    <div class="kv">
      <div><small>当日盈亏</small><span class="num ${pc(s.day_pnl)}">${sg(s.day_pnl)} (${sg(s.day_pnl_pct)}%)</span></div>
      <div><small>累计盈亏</small><span class="num ${pc(s.total_pnl)}">${sg(s.total_pnl)} (${sg(s.total_pnl_pct)}%)</span></div>
      <div><small>可用资金</small><span class="num">${money(s.cash)}</span></div>
      <div><small>持仓市值 / 今日成交</small><span class="num">${money(s.market_value)} / ${s.today_trades}笔</span></div>
    </div></div>`};
  const pos=[];for(const a of ['paper','live'])for(const p of ov.accounts[a].positions)pos.push({...p,acct:a});
  const d=decs[0];
  $('#app').innerHTML=`
  <div class="card" style="margin-bottom:14px"><div class="idx">${ov.indexes.map(i=>`<div><span class="mute">${i.name}</span> <b class="num ${pc(i.pct)}">${f2(i.price)}</b> <span class="num ${pc(i.pct)}">${sg(i.pct)}%</span></div>`).join('')}</div>
   <div class="idx" id="glob" style="margin-top:8px;font-size:12px"><span class="mute">外盘加载中…</span></div></div>
  <div class="grid g2">${acc('paper')}${acc('live')}</div>
  <div class="grid g21" style="margin-top:14px">
    <div class="card"><h3>净值曲线 <span class="r seg" id="eqseg"><button data-a="paper" class="act">模拟盘</button><button data-a="live">实盘</button></span></h3><div id="eq" class="chart"></div></div>
    <div class="card"><h3>最新 AI 决策 <a class="r" href="#ai">全部 →</a></h3>${d?decCard(d):'<div class="empty">还没有 AI 决策<br><small>定时任务每10分钟会自动介入</small></div>'}</div>
  </div>
  <div class="grid g21" style="margin-top:14px">
    <div class="card"><h3>持仓</h3><div class="scroll"><table><tr><th>账户</th><th>股票</th><th class="n">持仓/可卖</th><th class="n">成本</th><th class="n">现价</th><th class="n">今日</th><th class="n">市值</th><th class="n">仓位</th><th class="n">浮动盈亏</th><th></th></tr>
    ${pos.map(p=>`<tr><td>${p.acct=='paper'?'模拟':'实盘'}</td><td><a href="javascript:openStock('${p.symbol}')">${esc(p.name)}</a> <small class="mute">${p.symbol}</small></td>
      <td class="n">${p.shares}/${p.sellable}</td><td class="n">${f2(p.avg_cost,3)}</td><td class="n">${f2(p.price,3)}</td><td class="n ${pc(p.pct_today)}">${sg(p.pct_today)}%</td>
      <td class="n">${money(p.market_value)}</td><td class="n">${p.weight_pct}%</td><td class="n ${pc(p.pnl)}">${sg(p.pnl)} (${sg(p.pnl_pct)}%)</td>
      <td>${p.acct=='paper'&&p.sellable?`<button class="sm" onclick="quickSell('${p.symbol}',${p.sellable})">卖出</button>`:''}</td></tr>`).join('')||'<tr><td colspan=10 class="empty">空仓</td></tr>'}
    </table></div></div>
    <div class="card"><h3>最近信号 <a class="r" href="#rules">全部 →</a></h3><div class="list">${alerts.map(alertRow).join('')||'<div class="empty">暂无</div>'}</div></div>
  </div>
  <div class="card" style="margin-top:14px"><h3>持仓计划（买入后程序按此自动盯盘）</h3>
   ${pl.active.map(p=>`<div class="dec" style="border-color:${p.triggered_today.length?'var(--warn)':'var(--accent)'}"><div class="row"><b>${esc(p.name)}</b><small class="mute">${p.symbol} · ${p.account=='paper'?'模拟':'实盘'} · ${p.created}建仓 · 已持${p.held_trading_days}个交易日/${p.max_hold_days}</small>
     ${p.run_id?'<a class="tag" href="#committee" onclick="setTimeout(()=>showRun('+p.run_id+'),300)">委员会#'+p.run_id+'</a>':'<span class="tag bad">未经委员会</span>'}
     ${p.triggered_today.map(k=>'<span class="tag wait">今日触发:'+esc(k)+'</span>').join('')}</div>
     <div class="row num" style="margin:4px 0"><span>成本 ${f2(p.entry_price,3)}</span><span class="${pc(p.pnl_pct)}">${sg(p.pnl_pct)}%</span><span class="down">止损 ${f2(p.stop_loss,3)}（距 ${sg(p.dist_to_stop_pct)}%）</span><span class="up">目标 ${f2(p.target,3)}</span><span>移动止盈 ${p.trailing_pct||'-'}%</span><button class="sm" onclick="editStop('${p.account}','${p.symbol}',${p.stop_loss||0})">改止损</button></div>
     <div><small>${esc(p.thesis)}</small></div>
     ${(p.invalidation||[]).length?'<div><small class="mute">失效：'+p.invalidation.map(x=>esc(x.desc||x.type)).join('；')+'</small></div>':''}
     ${(p.watch_points||[]).length?'<div><small class="acc">观察：'+p.watch_points.map(esc).join('；')+'</small></div>':''}</div>`).join('')||'<div class="empty">空仓，无持仓计划</div>'}</div>
  <div class="card" style="margin-top:14px"><h3>7×24 快讯 <span class="mute r">新浪财经</span></h3><div class="list" id="flash" style="max-height:320px;overflow:auto"><div class="mute">加载中…</div></div></div>`;
  api('/api/global').then(g=>{const e=$('#glob');if(!e)return;if(g.error||!g.quotes){e.innerHTML='<span class="mute">外盘获取失败</span>';return}
    e.innerHTML=`<div><b class="acc">隔夜外盘 · ${esc(g.summary.mood)}</b></div>`+Object.values(g.quotes).map(v=>`<div><span class="mute">${esc(v.name)}</span> <span class="num ${pc(v.pct)}">${sg(v.pct)}%</span></div>`).join('')+
    (g.summary.notes.length?`<div class="mute">${g.summary.notes.map(esc).join('；')}</div>`:'')}).catch(()=>{const e=$('#glob');if(e)e.innerHTML='<span class="mute">外盘获取失败</span>'});
  api('/api/flash?n=20').then(fl=>{const e=$('#flash');if(e)e.innerHTML=fl.map(x=>`<div><span class="mute num">${esc(x.time)}</span> ${esc(x.text)}</div>`).join('')||'<div class="mute">暂无快讯</div>'}).catch(()=>{const e=$('#flash');if(e)e.innerHTML='<div class="mute">快讯获取失败（网络或数据源暂不可用）</div>'});
  document.querySelectorAll('#eqseg button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#eqseg button').forEach(x=>x.classList.remove('act'));b.classList.add('act');drawEq(b.dataset.a)});
  drawEq('paper');
}
function alertRow(a){return `<div><span class="mute num">${a.ts_str.slice(6)}</span> ${SIDE[a.side]||''} <b>${esc(a.name)}</b> <span class="tag">${a.source=='rule'?'规则':esc(a.strategy)}</span><br><small>${esc(a.message)}${a.action_result?' → '+esc(a.action_result):''}</small></div>`}
async function drawEq(a){
  const rows=await api('/api/equity?account='+a+'&days=60');const el=$('#eq');if(!el)return;
  charts=charts.filter(c=>!c.isDisposed()); const c=echarts.getInstanceByDom(el)||mkChart(el);
  c.setOption({backgroundColor:'transparent',grid:{left:60,right:16,top:16,bottom:28},tooltip:{trigger:'axis'},
    xAxis:{type:'category',data:rows.map(r=>r.ts_str),axisLabel:{color:'#8b98a8'}},yAxis:{type:'value',scale:true,splitLine:{lineStyle:{color:'#2a3442'}}},
    series:[{type:'line',data:rows.map(r=>r.equity),showSymbol:false,smooth:true,lineStyle:{color:'#e9b949'},areaStyle:{color:'rgba(233,185,73,.08)'}}],
    graphic:rows.length?[]:[{type:'text',left:'center',top:'middle',style:{text:'盘中每5分钟记录一次净值',fill:'#8b98a8'}}]},true);
}
async function editStop(acct,sym,cur){const v=prompt(`${sym} 新的止损价（当前 ${cur}）：`,cur);if(!v||isNaN(+v))return;
  await api('/api/plans',{method:'PUT',body:{account:acct,symbol:sym,stop_loss:+v}});toast('止损已改为 '+v);render()}
async function quickSell(sym,n){if(!confirm(`模拟盘卖出 ${sym} ${n} 股？`))return;const t=await post('/api/trade',{account:'paper',symbol:sym,side:'sell',shares:n});toast(`已卖出 ${t.shares} 股 @ ${t.price}，盈亏 ${t.pnl}`);render()}

// ---------- 行情 ----------
async function pageWatch(first){
  const w=await api('/api/watchlist');
  if(first){$('#app').innerHTML=`<div class="grid g21"><div class="card"><h3>自选股 · 五档盘口实时（约3秒）
    <span class="r row"><input id="addsym" placeholder="代码 如 600519" style="width:130px"><input id="addnote" placeholder="备注" style="width:100px"><button class="pri" onclick="addWatch()">加自选</button></span></h3>
    <div class="scroll" id="wt"></div></div><div class="card" id="detail"><div class="empty">点击左侧股票查看K线、MACD/KDJ、盘口和下单</div></div></div>`;}
  $('#wt').innerHTML=`<table><tr><th>股票</th><th class="n">现价</th><th class="n">涨跌幅</th><th class="n">买一</th><th class="n">卖一</th><th class="n">委比</th><th class="n">量比</th><th class="n">成交额</th><th class="n">换手</th><th></th></tr>
  ${w.map(x=>{const q=x.quote||{};const ob=x.ob||{};return `<tr class="click" onclick="openStock('${x.symbol}')"><td><b>${esc(x.name)}</b> <small class="mute">${x.symbol}</small>${x.note?`<br><small class="mute">${esc(x.note)}</small>`:''}</td>
   <td class="n ${pc(q.pct)}">${f2(q.price,3)}</td><td class="n ${pc(q.pct)}">${sg(q.pct)}%</td>
   <td class="n">${q.bids?f2(q.bids[0][0],3)+'<small class="mute">×'+q.bids[0][1]+'</small>':'--'}</td>
   <td class="n">${q.asks?f2(q.asks[0][0],3)+'<small class="mute">×'+q.asks[0][1]+'</small>':'--'}</td>
   <td class="n ${pc(ob.imbalance)}">${ob.imbalance!=null?sg(ob.imbalance*100,0)+'%':'--'}</td>
   <td class="n">${f2(q.vol_ratio)}</td><td class="n">${q.amount?f2(q.amount/1e8)+'亿':'--'}</td><td class="n">${f2(q.turnover)}%</td>
   <td><button class="sm" onclick="event.stopPropagation();delWatch('${x.symbol}')">✕</button></td></tr>`}).join('')}</table>`;
  if(stockSym&&!first)refreshBook();
}
async function addWatch(){const s=$('#addsym').value.trim();if(!s)return;const r=await post('/api/watchlist',{symbol:s,note:$('#addnote').value});toast('已添加 '+r.name);$('#addsym').value='';pageWatch()}
async function delWatch(s){if(!confirm('移出自选 '+s+'？'))return;await api('/api/watchlist/'+s,{method:'DELETE'});pageWatch()}
async function openStock(sym){
  if(page!=='watch'){stockSym=sym;go('watch');return}
  stockSym=sym;const d=await api(`/api/stock/${sym}?period=${stockPeriod}`);const q=d.quote||{};const s=d.summary||{};

function drawTicks(t){const el=$('#tc');if(!el)return;const c=mkChart(el);
  if(!t||!t.length){c.setOption({backgroundColor:'transparent',graphic:[{type:'text',left:'center',top:'middle',style:{text:'盘中监控运行后记录',fill:'#8b98a8'}}]});return}
  c.setOption({backgroundColor:'transparent',grid:{left:50,right:10,top:10,bottom:20},tooltip:{trigger:'axis'},
    xAxis:{type:'category',data:t.map(x=>x.time.slice(8,10)+':'+x.time.slice(10,12)+':'+x.time.slice(12,14)),axisLabel:{color:'#8b98a8'}},
    yAxis:{scale:true,splitLine:{lineStyle:{color:'#2a3442'}}},series:[{type:'line',data:t.map(x=>x.price),showSymbol:false,lineStyle:{color:'#4c9aff',width:1}}]})}
function drawK(d){const el=$('#kc');const c=mkChart(el);const k=d.kline;const x=k.map(b=>b.t);

  c.setOption({backgroundColor:'transparent',animation:false,tooltip:{trigger:'axis',axisPointer:{type:'cross'}},
    axisPointer:{link:[{xAxisIndex:'all'}]},legend:{top:0,left:0,itemWidth:14,itemHeight:8,textStyle:{color:'#8b98a8',fontSize:10},data:['MA5','MA10','MA20']},

    series:[{type:'candlestick',name:'价格',data:k.map(b=>[b.o,b.c,b.l,b.h]),itemStyle:{color:'#f0475a',color0:'#1fbf75',borderColor:'#f0475a',borderColor0:'#1fbf75'}},
      ...['ma5','ma10','ma20'].map((m,i)=>({type:'line',name:m.toUpperCase(),data:d[m],showSymbol:false,lineStyle:{width:1},color:['#e9b949','#4c9aff','#c678dd'][i]})),
      {type:'bar',name:'MACD',xAxisIndex:1,yAxisIndex:1,data:d.macd.hist.map(v=>({value:v,itemStyle:{color:v>=0?'#f0475a':'#1fbf75'}}))},
      {type:'line',name:'DIF',xAxisIndex:1,yAxisIndex:1,data:d.macd.dif,showSymbol:false,lineStyle:{width:1},color:'#e6edf3'},
      {type:'line',name:'DEA',xAxisIndex:1,yAxisIndex:1,data:d.macd.dea,showSymbol:false,lineStyle:{width:1},color:'#e9b949'},
      ...['k','d','j'].map((m,i)=>({type:'line',name:'KDJ.'+m.toUpperCase(),xAxisIndex:2,yAxisIndex:2,data:d.kdj[m],showSymbol:false,lineStyle:{width:1},color:['#e6edf3','#e9b949','#c678dd'][i]}))]})}

  if(all.length==1){const r=all[0];
    html+=`<div class="grid g21"><div class="card"><h3>分股票结果</h3><div class="scroll"><table><tr><th>股票</th><th>区间</th><th class="n">收益</th><th class="n">持有</th><th class="n">回撤</th><th class="n">交易</th><th class="n">胜率</th><th class="n">平均每笔</th><th class="n">平均持股天数</th><th class="n">费用</th></tr>

     <td class="n">${f2(x.max_drawdown_pct)}%</td><td class="n">${x.trades}</td><td class="n">${x.win_rate_pct??'--'}%</td><td class="n ${pc(x.avg_pnl_pct)}">${sg(x.avg_pnl_pct)}%</td><td class="n">${x.avg_hold_days??'--'}</td><td class="n">${f2(x.fees)}</td></tr>`).join('')}</table></div></div>
    <div class="card"><h3>资金曲线 <small class="mute" id="btname"></small></h3><div id="btc" class="chart"></div><h3 style="margin-top:10px">最近成交</h3><div id="btlog" class="list" style="max-height:260px;overflow:auto"></div></div></div>`;

    <label>手动设置持仓</label><div class="row"><input id="lsym" placeholder="代码" style="width:80px"><input id="lsh" type="number" placeholder="股数(0删除)" style="width:90px"><input id="lcost" type="number" step="0.001" placeholder="成本" style="width:80px"><button onclick="setLivePos()">设置</button></div></div></div>
  <div class="card"><h3>仓位管理（反马丁）</h3><div class="form">
    <label>定仓方式</label><select data-sec="sizing" data-k="mode"><option value="risk" ${c.sizing.mode=='risk'?'selected':''}>按单笔风险（推荐）</option><option value="percent" ${c.sizing.mode=='percent'?'selected':''}>按总资产百分比</option></select>
    <label>单笔风险 % 总资产</label>${inp('sizing','risk_per_trade_pct','number')}
    <label>允许金字塔加仓</label>${chk('sizing','pyramid_enabled')}
    <label>浮盈≥%才加仓</label>${inp('sizing','pyramid_min_profit_pct','number')}
    <label>最多加仓次数</label>${inp('sizing','pyramid_max_adds','number')}
    <label>加仓量 = 上次×</label>${inp('sizing','pyramid_add_ratio','number')}
    <label>加仓后止损提到保本</label>${chk('sizing','pyramid_raise_stop')}
    <span></span><button class="pri" onclick="saveCfg()">保存</button></div>
    <p class="mute"><small>单笔风险：股数 = 总资产×风险% ÷ (买入价−止损价)。例：1万×2%=200元，止损距离0.7元 → 最多285股 → 200股。<br>
    亏损补仓（马丁格尔）始终禁止；AI 只能上移止损，不能下调。</small></p></div>
  <div class="card"><h3>交易范围 · 委员会 · 持仓计划</h3><div class="form">
    <label>已开通板块</label><div class="row">${['main','gem','star','bj','etf'].map(b=>`<label><input type="checkbox" class="board" value="${b}" ${c.universe.boards.includes(b)?'checked':''}> ${{main:'主板',gem:'创业板',star:'科创板',bj:'北交所',etf:'ETF'}[b]}</label>`).join('')}</div>
    <label>最低成交额(亿)</label>${inp('universe','min_amount_yi','number')}
    <label>建仓需过委员会</label>${chk('committee','required_for_buy')}
    <label>结论有效期(小时)</label>${inp('committee','valid_hours','number')}
    <label>多空辩论轮数</label>${inp('committee','debate_rounds','number')}
    <label>通过最低置信度</label>${inp('committee','min_confidence','number')}
    <label>被拦时自动开会</label>${chk('committee','auto_run_builtin')}
    <label>模拟盘计划止损自动卖</label>${chk('plans','auto_stop_loss_paper')}
    <label>默认止损%</label>${inp('plans','default_stop_pct','number')}
    <label>默认最长持有(天)</label>${inp('plans','default_max_hold_days','number')}
    <label>总仓位上限 强势/震荡/弱势/冰点</label><div class="row">${['强势','震荡','弱势','冰点'].map(k=>`<input type="number" step="0.05" class="cap" data-k="${k}" value="${c.regime.caps[k]}" style="width:64px">`).join('')}</div>
    <span></span><button class="pri" onclick="saveCfg()">保存</button></div></div>
  <div class="card"><h3>服务</h3><div class="form">
    <label>访问地址(推送链接)</label>${inp('server','public_url')}
    <label>访问 Token</label>${inp('server','token','password','对外开放端口时务必设置')}
    <label>行情刷新(秒)</label>${inp('monitor','poll_interval_sec','number')}
    <label>记录秒级tick</label>${chk('monitor','record_ticks')}
    <span></span><button class="pri" onclick="saveCfg()">保存</button></div><p class="mute"><small>修改 host/port 需编辑 data/config.json 后重启</small></p></div></div>`;
}
// 模型下拉框：预设 + 自定义（隐藏的 input 才是真正保存的字段）
const MODELS=[['deepseek-flash','DeepSeek V4.1 Flash（推荐·快·便宜）','https://api.deepseek.com'],
  ['deepseek-v4-pro','DeepSeek V4 Pro（更强·约贵3倍）','https://api.deepseek.com']];
function modelSel(key,val,allowSame){
  val=val||'';const known=MODELS.some(m=>m[0]==val)||(allowSame&&val=='');
  const opts=(allowSame?[['','同上（和决策模型一样）']]:[]).concat(MODELS.map(m=>[m[0],m[1]]));
  return `<div class="row" style="flex-wrap:nowrap"><select id="sel_${key}" onchange="pickModel('${key}')" style="flex:1">
    ${opts.map(([v,l])=>`<option value="${v}" ${known&&v==val?'selected':''}>${l}</option>`).join('')}
    <option value="__custom" ${known?'':'selected'}>自定义…</option></select>
    <input type="text" data-sec="ai" data-k="${key}" id="in_${key}" value="${esc(val)}" placeholder="模型名，如 qwen-plus"
      style="flex:1;${known?'display:none':''}"></div>`}
function pickModel(key){const v=$('#sel_'+key).value,inp=$('#in_'+key);
  if(v=='__custom'){inp.style.display='';inp.value='';inp.focus();return}
  inp.style.display='none';inp.value=v;
  const m=MODELS.find(x=>x[0]==v);const url=document.querySelector('[data-sec="ai"][data-k="llm_base_url"]');
  if(m&&key=='llm_model'&&url)url.value=m[2]}
async function saveCfg(){const p={};document.querySelectorAll('[data-sec]').forEach(i=>{const s=i.dataset.sec,k=i.dataset.k;p[s]=p[s]||{};
  p[s][k]=i.type=='checkbox'?i.checked:(i.type=='number'?+i.value:i.value)});
  p.ai.accounts=[...($('#ai_paper').checked?['paper']:[]),...($('#ai_live').checked?['live']:[])];
  p.universe=p.universe||{};p.universe.boards=[...document.querySelectorAll('.board:checked')].map(x=>x.value);
  p.regime={caps:{}};document.querySelectorAll('.cap').forEach(i=>p.regime.caps[i.dataset.k]=+i.value);
  await post('/api/config',p);toast('已保存');status()}
async function testPush(){await saveCfg();const r=await post('/api/notify/test');toast((r.ok?'✅ ':'❌ ')+esc(r.channels))}
async function resetPaper(){if(!confirm('清空模拟盘所有持仓和成交记录？'))return;await post('/api/accounts/paper/reset',{cash:+$('#rcash').value});toast('已重置')}
async function syncLive(){const r=await post('/api/accounts/live/sync');toast(esc(r.message))}
async function setLive(){await post('/api/accounts/live/set',{cash:+$('#lcash').value});toast('已设置')}
async function setLivePos(){await post('/api/accounts/live/set',{positions:[{symbol:$('#lsym').value,shares:+$('#lsh').value,avg_cost:+$('#lcost').value||0}]});toast('已设置')}

// ---------- 路由 ----------
const PAGES={dash:[pageDash,10000],watch:[pageWatch,3000],screen:[pageScreen,0],committee:[pageCommittee,0],rules:[pageRules,0],strategies:[pageStrategies,0],backtest:[pageBacktest,0],ai:[pageAI,30000],orders:[pageOrders,10000],settings:[pageSettings,0]};
async function render(first){const [fn]=PAGES[page];if(!first&&page!='watch'){charts.forEach(c=>c.dispose());charts=[]}try{await fn(first)}catch(e){console.error(e)}}
function route(){page=(location.hash.slice(1)||'dash');if(!PAGES[page])page='dash';
  document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('act',a.getAttribute('href')=='#'+page));
  charts.forEach(c=>c.dispose());charts=[];clearInterval(timer);
  render(true).then(()=>{if(page=='watch'&&stockSym)openStock(stockSym)});
  const iv=PAGES[page][1];if(iv)timer=setInterval(()=>{if(!document.hidden&&!document.activeElement.matches('input,textarea,select'))render(false)},iv)}
window.addEventListener('hashchange',route);route();status();setInterval(status,5000);
</script>
