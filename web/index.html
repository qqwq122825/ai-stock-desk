<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI 量化决策台</title>
<script src="/echarts.min.js"></script>
<script>window.echarts||document.write('<script src="https://lib.baomitu.com/echarts/5.4.3/echarts.min.js"><\/script>')</script>
<style>
:root{
  --bg:#0d1117;--panel:#151b23;--panel2:#1c2430;--line:#2a3442;--text:#e6edf3;--mute:#8b98a8;
  --up:#f0475a;--down:#1fbf75;--accent:#e9b949;--blue:#4c9aff;--warn:#ff9f43;
  --mono:"SF Mono",Menlo,Consolas,"Roboto Mono",monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
a{color:var(--blue)}
header{position:sticky;top:0;z-index:10;background:#0b0f14ee;backdrop-filter:blur(6px);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:14px;padding:10px 18px;flex-wrap:wrap}
.logo{font-weight:700;letter-spacing:.5px;font-size:16px}
.logo b{color:var(--accent)}
.pill{padding:2px 9px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);font-size:12px;color:var(--mute);white-space:nowrap}
.pill.on{color:var(--down);border-color:#1fbf7555}.pill.warn{color:var(--warn);border-color:#ff9f4366;cursor:pointer}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--mute);margin-right:5px;vertical-align:1px}
.dot.on{background:var(--down);box-shadow:0 0 6px var(--down)}
nav{display:flex;gap:2px;margin-left:auto;flex-wrap:wrap}
nav a{color:var(--mute);text-decoration:none;padding:6px 11px;border-radius:6px}
nav a.act,nav a:hover{color:var(--text);background:var(--panel2)}
nav .sep{width:1px;background:var(--line);margin:4px 6px}
nav a.tool{font-size:13px}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.steps>div{background:var(--panel2);border-radius:8px;padding:8px 10px;border-left:3px solid var(--line)}
.steps>div.run{border-left-color:var(--down)}.steps>div.done{border-left-color:var(--blue)}.steps>div.wait{border-left-color:var(--warn)}
.steps small{display:block;color:var(--mute);font-size:11px}
@media(max-width:900px){.steps{grid-template-columns:1fr 1fr}}
.tl>div{display:grid;grid-template-columns:56px 24px 1fr;gap:6px;padding:9px 0;border-bottom:1px dashed var(--line)}
.tl .t{color:var(--mute);font:12px var(--mono);padding-top:2px}
.tl .d{color:var(--mute);font-size:12px;margin-top:3px;white-space:pre-wrap}
.tlday{margin:16px 0 4px;font-weight:600;color:var(--accent)}
.switch{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:13px}
.switch i{width:34px;height:18px;border-radius:9px;background:var(--line);position:relative;transition:.2s}
.switch i:after{content:'';position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:.2s}
.switch.on i{background:var(--down)}.switch.on i:after{left:18px}
main{padding:16px 18px;max-width:1500px;margin:0 auto}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.g21{grid-template-columns:2fr 1fr}
@media(max-width:900px){.g2,.g3,.g4,.g21{grid-template-columns:1fr}nav{margin-left:0}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;min-width:0}
.card h3{margin:0 0 10px;font-size:13px;color:var(--mute);font-weight:600;display:flex;align-items:center;gap:8px}
.card h3 .r{margin-left:auto}
.big{font:600 26px var(--mono)}
.num{font-family:var(--mono)}
.up{color:var(--up)}.down{color:var(--down)}.mute{color:var(--mute)}.acc{color:var(--accent)}
.kv{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.kv div{background:var(--panel2);border-radius:6px;padding:6px 8px}
.kv small{display:block;color:var(--mute);font-size:11px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{color:var(--mute);font-weight:500;font-size:12px}
td.n,th.n{text-align:right;font-family:var(--mono)}
tr.click{cursor:pointer}tr.click:hover td{background:var(--panel2)}
.scroll{overflow-x:auto}
button,.btn{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:5px 12px;cursor:pointer;font:inherit;font-size:13px}
button:hover{border-color:var(--mute)}
button.pri{background:var(--accent);color:#111;border-color:var(--accent);font-weight:600}
button.red{background:var(--up);border-color:var(--up);color:#fff}
button.grn{background:var(--down);border-color:var(--down);color:#fff}
button.sm{padding:2px 8px;font-size:12px}
input,select,textarea{background:#0b0f14;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:5px 8px;font:inherit;font-size:13px;min-width:0}
textarea{width:100%;font-family:var(--mono);font-size:12px}
label{font-size:12px;color:var(--mute)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.form{display:grid;grid-template-columns:150px 1fr;gap:8px 12px;align-items:center}
.form input[type=text],.form input[type=number],.form input[type=password],.form select{width:100%}
.form input[type=checkbox]{justify-self:start}
@media(max-width:600px){.kv{grid-template-columns:1fr 1fr}.form{grid-template-columns:110px 1fr}main{padding:12px}}
.tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:4px;background:var(--panel2);color:var(--mute);border:1px solid var(--line)}
.tag.buy{color:var(--up);border-color:#f0475a55}.tag.sell{color:var(--down);border-color:#1fbf7555}
.tag.ok{color:var(--down)}.tag.bad{color:var(--up)}.tag.wait{color:var(--warn);border-color:#ff9f4366}
.list>div{padding:8px 0;border-bottom:1px dashed var(--line)}
.list>div:last-child{border:0}
.chart{height:300px}
.empty{color:var(--mute);padding:18px;text-align:center}
.book{font-family:var(--mono);font-size:12px;width:100%}
.book td{padding:2px 6px;border:0}
.dec{border-left:3px solid var(--accent);padding:8px 12px;margin-bottom:12px;background:var(--panel2);border-radius:0 8px 8px 0}
.dec .view{margin:6px 0;white-space:pre-wrap}
pre{white-space:pre-wrap;word-break:break-all;font-size:11px;background:#0b0f14;padding:8px;border-radius:6px;max-height:420px;overflow:auto}
#toast{position:fixed;right:18px;bottom:18px;background:var(--panel2);border:1px solid var(--line);padding:10px 14px;border-radius:8px;display:none;max-width:420px;z-index:99}
.hidden{display:none}
.order{border:1px solid var(--warn);border-radius:8px;padding:10px;margin-bottom:10px;background:#ff9f430d}
.seg button{border-radius:0;margin-left:-1px}.seg button.act{background:var(--accent);color:#111;border-color:var(--accent)}
.seg button:first-child{border-radius:6px 0 0 6px}.seg button:last-child{border-radius:0 6px 6px 0}
.idx{display:flex;gap:18px;overflow-x:auto;padding-bottom:4px}
body.live .idx div{white-space:nowrap}
/* ================= 两套模式 = 两套界面 ================= */
body[data-mode=paper]{--bg:#050a18;--panel:rgba(12,22,46,.78);--panel2:#0f1d3a;--line:#1b2d57;--text:#e4ecff;--mute:#7d90b8;
  --accent:#22d3ee;--accent2:#818cf8;--blue:#60a5fa;--glow:#22d3ee;--ink:#03121a;--acc-a:rgba(34,211,238,.35);--warn:#fbbf24;
  background:radial-gradient(1100px 520px at 85% -8%,rgba(37,99,235,.33),transparent 60%),radial-gradient(800px 480px at -5% 30%,rgba(8,145,178,.2),transparent 60%),
   linear-gradient(rgba(34,211,238,.035) 1px,transparent 1px) 0 0/44px 44px,linear-gradient(90deg,rgba(34,211,238,.035) 1px,transparent 1px) 0 0/44px 44px,#050a18;
  background-attachment:fixed}
body[data-mode=live]{--bg:#0c0907;--panel:rgba(27,21,14,.86);--panel2:#231b11;--line:#3b2f1e;--text:#f4ebdc;--mute:#a8967a;
  --accent:#f5b942;--accent2:#ff7a45;--blue:#f0b35a;--glow:#f5b942;--ink:#1a1206;--acc-a:rgba(245,185,66,.35);--warn:#ff9f43;
  background:radial-gradient(1000px 460px at 50% -12%,rgba(146,64,14,.28),transparent 60%),repeating-linear-gradient(135deg,rgba(255,255,255,.012) 0 2px,transparent 2px 9px),#0c0907;
  background-attachment:fixed}
body{transition:background-color .4s}
a{color:var(--blue)}

/* 顶栏 */
header{gap:18px;padding:10px 20px}
body[data-mode=paper] header{background:rgba(5,10,24,.85);border-bottom:1px solid rgba(34,211,238,.22);box-shadow:0 10px 30px -22px #22d3ee}
body[data-mode=live] header{background:rgba(12,9,7,.9);border-bottom:1px solid rgba(245,185,66,.3);box-shadow:0 10px 30px -22px #f5b942}
.brand{display:flex;align-items:center;gap:10px;white-space:nowrap}
.brand .mk{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-size:18px;color:var(--ink);
  background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 0 22px -4px var(--glow)}
.brand b{display:block;font-size:17px;letter-spacing:2px;line-height:1.2}
.brand small{display:block;color:var(--accent);font-size:11px;letter-spacing:2px}
nav{margin-left:10px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{position:relative;white-space:nowrap;font-size:14px}
nav a.act{color:var(--accent);background:transparent;font-weight:600}
nav a.act:after{content:'';position:absolute;left:11px;right:11px;bottom:-1px;height:2px;border-radius:2px;background:var(--accent);box-shadow:0 0 10px var(--glow)}
nav .badge{font-style:normal;display:inline-block;min-width:17px;height:17px;line-height:17px;padding:0 4px;margin-left:4px;border-radius:9px;background:var(--up);color:#fff;font-size:11px;text-align:center;vertical-align:1px}
.hr{margin-left:auto;display:flex;gap:8px;align-items:center}
.msw{position:relative;display:flex;border:1px solid var(--line);border-radius:99px;padding:3px;cursor:pointer;background:rgba(0,0,0,.35);user-select:none}
.msw span{position:relative;z-index:1;padding:5px 13px;font-size:13px;color:var(--mute);transition:color .35s;white-space:nowrap}
.msw .kn{position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);border-radius:99px;background:linear-gradient(135deg,#22d3ee,#6366f1);
  transition:left .5s cubic-bezier(.7,-.35,.3,1.35),background .5s;box-shadow:0 0 16px rgba(34,211,238,.6)}
.msw.on .kn{left:50%;background:linear-gradient(135deg,#f5b942,#ff7a45);box-shadow:0 0 16px rgba(245,185,66,.6)}
.msw:not(.on) .s1{color:#fff;font-weight:600}.msw.on .s2{color:#1a1206;font-weight:700}
.tools{position:relative}
.tools>button{background:transparent;border:1px solid var(--line);border-radius:99px;padding:5px 12px;color:var(--mute)}
.tools>button.act{color:var(--accent);border-color:var(--accent)}
.tools .menu{position:absolute;right:0;top:calc(100% + 8px);background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:6px;display:none;min-width:160px;box-shadow:0 24px 50px -12px #000;z-index:30}
.tools.open .menu{display:block;animation:rise .2s both}
.tools .menu a{display:block;padding:8px 12px;border-radius:8px;color:var(--text);text-decoration:none}
.tools .menu a:hover,.tools .menu a.act{background:var(--line);color:var(--accent)}
@media(max-width:1000px){header{display:grid;grid-template-columns:auto 1fr;gap:8px 12px}.hr{justify-self:end;flex-wrap:wrap;justify-content:flex-end}nav{grid-column:1/-1;margin:0}
  #sess,#mon{display:none}}

/* 切换模式的全屏转场 */
#warp{position:fixed;inset:0;z-index:200;display:none;place-items:center;text-align:center;color:#fff;clip-path:circle(0 at var(--x) var(--y))}
#warp[data-mode=paper]{background:radial-gradient(circle at 50% 42%,#0e4a6e,#050a18 68%)}
#warp[data-mode=live]{background:radial-gradient(circle at 50% 42%,#6b3d0f,#0c0907 68%)}
#warp.in{display:grid;animation:wIn .65s cubic-bezier(.7,0,.3,1) forwards}
#warp.out{display:grid;clip-path:circle(150% at var(--x) var(--y));animation:wOut .5s ease forwards}
@keyframes wIn{to{clip-path:circle(150% at var(--x) var(--y))}}
@keyframes wOut{to{opacity:0;transform:scale(1.05)}}
#warp .wi{font-size:56px;animation:wPop .55s .12s both}
#warp .wt{font-size:42px;font-weight:800;letter-spacing:10px;animation:wPop .55s .2s both}
#warp[data-mode=paper] .wt{color:#a5f3fc;text-shadow:0 0 32px #22d3ee}
#warp[data-mode=live] .wt{color:#fde68a;text-shadow:0 0 32px #f59e0b}
#warp .ws{margin-top:10px;color:rgba(255,255,255,.7);letter-spacing:4px;animation:wPop .55s .28s both}
@keyframes wPop{from{opacity:0;transform:translateY(18px) scale(.95)}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
#app.enter>*{animation:rise .5s both}
#app.enter>*:nth-child(2){animation-delay:.06s}#app.enter>*:nth-child(3){animation-delay:.12s}#app.enter>*:nth-child(4){animation-delay:.18s}

/* 卡片 & 通用 */
.card{border-radius:14px;backdrop-filter:blur(8px);transition:border-color .3s}
.card h3{letter-spacing:1px}
body[data-mode=paper] .card{box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
body[data-mode=paper] .card:hover{border-color:rgba(34,211,238,.4)}
body[data-mode=paper] .card h3{color:#7dd3fc}
body[data-mode=live] .card h3{color:#e7c27d}
button.pri{background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--ink);border:0;box-shadow:0 4px 18px -6px var(--glow)}
.seg button.act{background:var(--accent);border-color:var(--accent);color:var(--ink)}
.hint{border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:10px;padding:10px 14px;margin-bottom:14px;background:var(--panel);font-size:13px}
.hint b{color:var(--accent)}
pre{background:rgba(0,0,0,.35)}
input,select,textarea{background:rgba(0,0,0,.35)}

/* 跑马灯 */
.ticker{overflow:hidden;border:1px solid var(--line);border-radius:12px;background:var(--panel);margin-bottom:14px;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent);mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent)}
.tk{display:inline-flex;gap:22px;white-space:nowrap;padding:9px 0;animation:mq 70s linear infinite;font-size:13px}
.tk:hover{animation-play-state:paused}
.tk em{font-style:normal;color:var(--mute)}.tk i{color:var(--accent);font-style:normal;opacity:.45}
@keyframes mq{to{transform:translateX(-50%)}}

/* 驾驶舱 hero */
.hero{display:grid;grid-template-columns:200px 1fr auto;gap:26px;align-items:center;padding:20px 26px;margin-bottom:14px;border-radius:18px;
  border:1px solid rgba(34,211,238,.25);background:linear-gradient(120deg,#0b1a3a 0%,#0a1328 55%,#141038 100%);position:relative;overflow:hidden}
.hero:before{content:'';position:absolute;inset:0;background:radial-gradient(420px 200px at 12% 50%,rgba(34,211,238,.16),transparent);pointer-events:none}
.hero:after{content:'';position:absolute;left:-30%;top:0;bottom:0;width:30%;background:linear-gradient(90deg,transparent,rgba(165,243,252,.06),transparent);animation:sweep 6s ease-in-out infinite;pointer-events:none}
@keyframes sweep{to{left:130%}}
.orb{width:176px;height:176px;position:relative;display:grid;place-items:center}
.orb .ring{position:absolute;inset:0;border-radius:50%;border:1px solid rgba(34,211,238,.3)}
.orb .r1{border:2px solid transparent;border-top-color:#22d3ee;border-right-color:rgba(34,211,238,.35);animation:spin 2.6s linear infinite;filter:drop-shadow(0 0 6px #22d3ee)}
.orb .r2{inset:16px;border:2px dashed rgba(129,140,248,.45);animation:spin 10s linear infinite reverse}
.orb .r3{inset:34px;background:radial-gradient(circle,rgba(34,211,238,.25),transparent 70%);border:1px solid rgba(34,211,238,.45);animation:pulse 2.4s ease-in-out infinite}
.orb .core{position:relative;text-align:center}
.orb .core b{display:block;font-size:22px;color:#a5f3fc;text-shadow:0 0 14px #22d3ee;letter-spacing:2px}
.orb .core small{color:var(--mute);font-size:11px}
.orb.idle .r1{animation-duration:9s}.orb.idle .r3{animation-duration:5s}
.orb.paused .ring{border-color:rgba(100,116,139,.35)!important;animation:none!important;filter:none}.orb.paused .r3{background:none}
.orb.paused .core b{color:#94a3b8;text-shadow:none}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{transform:scale(1.07);opacity:.65}}
.mega{font:700 46px/1.15 var(--mono);letter-spacing:1px;margin:4px 0 8px;-webkit-background-clip:text;background-clip:text;color:transparent;
  background-image:linear-gradient(90deg,#e0f2fe,#67e8f9)}
body[data-mode=live] .mega{background-image:linear-gradient(90deg,#fff3d6,#f5b942)}
.hnums small{color:var(--mute);letter-spacing:2px}
.hside{display:grid;grid-template-columns:repeat(3,auto);gap:12px 26px;align-items:end;justify-items:end}
.hside .switch{grid-column:1/-1}
.stat b{display:block;font:700 30px var(--mono);text-align:right;color:var(--text)}.stat b em{font-size:15px;color:var(--mute);font-style:normal}
.stat small{color:var(--mute);font-size:11px}
@media(max-width:900px){.hero{grid-template-columns:1fr;justify-items:center;text-align:center}.hside{justify-items:center}.mega{font-size:36px}}

/* 自动流程 */
.flow{display:grid;grid-template-columns:repeat(4,1fr);position:relative;margin-top:8px}
.flow:before{content:'';position:absolute;left:12.5%;right:12.5%;top:22px;height:2px;opacity:.45;
  background:repeating-linear-gradient(90deg,var(--accent) 0 10px,transparent 10px 20px);background-size:20px 2px;animation:flowm 1s linear infinite}
@keyframes flowm{to{background-position:20px 0}}
.node{text-align:center;position:relative;padding:0 8px}
.node .nd{width:44px;height:44px;margin:0 auto 8px;border-radius:50%;display:grid;place-items:center;background:var(--panel2);border:2px solid var(--line);font-weight:700;position:relative;z-index:1}
.node b{display:block}.node small{display:block;color:var(--mute);font-size:11px}
.node .st{font-size:12px;margin:3px 0;color:var(--text)}
.node.run .nd{border-color:#22c55e;color:#22c55e;box-shadow:0 0 0 6px rgba(34,197,94,.1),0 0 22px rgba(34,197,94,.55);animation:pulse 1.8s infinite}
.node.run .st{color:#4ade80}
.node.done .nd{border-color:var(--accent);color:var(--accent);box-shadow:0 0 16px -2px var(--glow)}
.node.wait .nd{border-color:rgba(251,191,36,.6);color:#fbbf24}
.node.off{opacity:.45}
@media(max-width:700px){.flow{grid-template-columns:1fr 1fr;gap:18px}.flow:before{display:none}}

/* 持仓 + 计划进度条（止损 ←→ 目标） */
.pos{padding:12px 4px 6px;border-bottom:1px dashed var(--line)}.pos:last-child{border:0}
.pn2{cursor:pointer;font-size:15px}.big2{font:700 20px var(--mono)}
.pbar{position:relative;height:8px;border-radius:4px;margin:26px 0 22px;background:linear-gradient(90deg,rgba(31,191,117,.35),rgba(100,116,139,.25) 45%,rgba(240,71,90,.35))}
.pbar .pfill{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:linear-gradient(90deg,transparent,var(--acc-a))}
.pbar .pn{position:absolute;top:-5px;width:4px;height:18px;margin-left:-2px;border-radius:2px;background:#fff;box-shadow:0 0 12px var(--glow);transition:left .8s}
.pbar .pe{position:absolute;top:-3px;width:2px;height:14px;margin-left:-1px;background:var(--mute)}
.pbar span{position:absolute;top:12px;font-size:11px;color:var(--mute);white-space:nowrap}
.pbar .l{left:0;color:var(--down)}.pbar .rr{right:0;color:var(--up)}.pbar .m{transform:translateX(-50%);top:-19px}

/* 实盘交易台 */
.dhero{display:grid;grid-template-columns:1.35fr 1fr;gap:14px;margin-bottom:14px}
@media(max-width:900px){.dhero{grid-template-columns:1fr}}
.queue{border:1px solid rgba(245,185,66,.35);border-radius:18px;padding:18px 22px;background:linear-gradient(135deg,#2b1d0b,#150e07);position:relative;overflow:hidden}
.queue:before{content:'';position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(245,185,66,.18),transparent 70%)}
.queue .qn{font:800 68px/1 var(--mono);color:#fcd34d;text-shadow:0 0 30px rgba(245,158,11,.55)}
.queue.zero .qn{color:#5c4a2e;text-shadow:none}
.queue.has{animation:qglow 2.2s ease-in-out infinite}
@keyframes qglow{50%{box-shadow:0 0 0 1px #f5b942,0 0 44px -8px #f5b942}}
.steps5{display:flex;margin-top:4px}
.steps5 div{flex:1;position:relative;padding:10px 8px 0 0;font-size:12px;color:var(--mute);border-top:2px solid var(--line)}
.steps5 div b{display:block;color:var(--text);font-size:13px}
.steps5 div:before{content:attr(data-n);position:absolute;top:-11px;left:0;width:20px;height:20px;border-radius:50%;background:var(--panel2);border:2px solid var(--line);font-size:11px;display:grid;place-items:center;color:var(--mute)}
.steps5 div.me{border-top-color:var(--accent)}.steps5 div.me b{color:var(--accent)}.steps5 div.me:before{border-color:var(--accent);color:var(--accent);box-shadow:0 0 10px var(--glow)}
.steps5 div{padding-left:0;padding-top:16px}
@media(max-width:700px){.steps5{flex-direction:column;gap:12px}}
.bstat{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.bstat div{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.bstat b{display:block;font:700 24px var(--mono)}.bstat small{color:var(--mute)}
@media(max-width:700px){.bstat{grid-template-columns:1fr 1fr}}
.row .r{margin-left:auto}
nav .badge.hidden{display:none}
</style>
</head>
<body>
<header>
  <div class="brand"><div class="mk" id="bmark">🛰</div><div><b id="bt">AI 驾驶舱</b><small id="bs">模拟盘</small></div></div>
  <nav id="nav"></nav>
  <div class="hr">
    <span class="pill" id="sess">--</span>
    <span class="pill" id="mon"><span class="dot"></span>监控</span>
    <span class="pill warn hidden" id="pend" onclick="setAcct('live')">实盘待确认 0</span>
    <div class="msw" id="modeSw" onclick="toggleMode()" title="切换模拟盘 / 实盘"><i class="kn"></i><span class="s1">🛰 模拟盘</span><span class="s2">◆ 实盘</span></div>
    <div class="tools"><button id="toolBtn" onclick="this.parentElement.classList.toggle('open')">⚙ 工具</button><div class="menu" id="toolMenu"></div></div>
  </div>
</header>
<div id="warp"></div>
<main id="app"></main>
<div id="toast"></div>

<script>
const $=s=>document.querySelector(s);
const TOKEN=(()=>{const u=new URLSearchParams(location.search).get('token');try{if(u)localStorage.setItem('tk',u);return u||localStorage.getItem('tk')||''}catch(e){return u||''}})();
async function api(path,opt={}){
  const r=await fetch(path,{method:opt.method||'GET',headers:{'Content-Type':'application/json','X-Token':TOKEN},body:opt.body?JSON.stringify(opt.body):undefined});
  const j=await r.json().catch(()=>({error:'响应解析失败'}));
  if(r.status==401&&j.login){location.href='/login';throw new Error('需要登录')}
  if(!r.ok){toast('❌ '+(j.error||r.status));throw new Error(j.error)}
  return j;
}
const post=(p,b)=>api(p,{method:'POST',body:b||{}});
async function logout(){await fetch('/api/logout',{method:'POST'});location.href='/login'}
function toast(t){const e=$('#toast');e.innerHTML=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',4000)}
const f2=(x,d=2)=>x==null||isNaN(x)?'--':Number(x).toFixed(d);
const pc=x=>x==null?'':(x>0?'up':x<0?'down':'');
const sg=(x,d=2)=>x==null?'--':(x>0?'+':'')+f2(x,d);
const money=x=>x==null?'--':Number(x).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SIDE={buy:'<span class="tag buy">买入</span>',sell:'<span class="tag sell">卖出</span>',watch:'<span class="tag">关注</span>'};
const ST={pending_confirm:'<span class="tag wait">待确认</span>',confirmed:'<span class="tag wait">已确认待成交</span>',submitted:'<span class="tag wait">已报单</span>',filled:'<span class="tag ok">已成交</span>',rejected:'<span class="tag bad">拒绝</span>',expired:'<span class="tag">过期</span>',cancelled:'<span class="tag">取消</span>'};
let charts=[],timer=null,page='',stockSym=null,stockPeriod='day';
// ===== 两个模式 = 两套完全独立的界面（主题、菜单、首页、每个页面的内容都不同） =====
let ACCT=(()=>{try{return localStorage.getItem('acct')==='live'?'live':'paper'}catch(e){return 'paper'}})();
const ACCT_NAME={paper:'模拟盘',live:'实盘'};
const MODES={
  paper:{home:'cockpit',brand:'AI 驾驶舱',sub:'模拟盘 · 全自动驾驶',icon:'🛰',
    nav:[['cockpit','驾驶舱'],['feed','AI 动态'],['screen','今日选股'],['committee','投研委员会'],['book','持仓战绩']],
    warp:'AI 驾驶舱',warpSub:'模拟盘 · AI 全自动 · 你只需要看'},
  live:{home:'desk',brand:'实盘交易台',sub:'真实资金 · 你来拍板',icon:'◆',
    nav:[['desk','交易台'],['orders','待确认'],['feed','AI 建议'],['screen','选股参考'],['committee','委员会'],['ledger','持仓对账']],
    warp:'实盘交易台',warpSub:'真实资金 · AI 只建议 · 每一笔由你确认'}};
const MODE_PAGES={paper:MODES.paper.nav.map(x=>x[0]),live:MODES.live.nav.map(x=>x[0])};
const TOOLS=[['watch','行情盯盘'],['rules','规则预警'],['strategies','策略库'],['backtest','回测'],['ai','AI 决策中心'],['settings','设置']];
function applyMode(){
  const M=MODES[ACCT];document.body.dataset.mode=ACCT;document.body.classList.toggle('live',ACCT==='live');
  $('#bt').textContent=M.brand;$('#bs').textContent=M.sub;$('#bmark').textContent=M.icon;document.title=M.brand+' · AI 量化';
  $('#nav').innerHTML=M.nav.map(([h,t])=>`<a href="#${h}" class="${h==page?'act':''}">${t}${h=='orders'?'<i class="badge hidden" id="nbadge"></i>':''}</a>`).join('');
  $('#toolMenu').innerHTML=TOOLS.map(([h,t])=>`<a href="#${h}" class="${h==page?'act':''}">${t}</a>`).join('')+'<a href="javascript:logout()">退出登录</a>';
  $('#toolBtn').classList.toggle('act',TOOLS.some(t=>t[0]==page));
  $('#modeSw').classList.toggle('on',ACCT=='live');
  if(window._st)paintStatus(window._st);
}
function setAcct(a){if(a===ACCT||$('#warp').className)return;
  const w=$('#warp'),M=MODES[a],r=$('#modeSw').getBoundingClientRect();
  w.style.setProperty('--x',(r.left+r.width/2)+'px');w.style.setProperty('--y',(r.top+r.height/2)+'px');
  w.dataset.mode=a;w.innerHTML=`<div><div class="wi">${M.icon}</div><div class="wt">${M.warp}</div><div class="ws">${M.warpSub}</div></div>`;
  w.className='in';$('#modeSw').classList.toggle('on',a=='live');
  setTimeout(()=>{ACCT=a;CUR_RUN=null;RUN_SIG='';LIST_SIG='';try{localStorage.setItem('acct',a)}catch(e){}
    if(location.hash.slice(1)===M.home)route();else location.hash=M.home;
    setTimeout(()=>{w.className='out';setTimeout(()=>w.className='',520)},250)},700);
}
function toggleMode(){setAcct(ACCT=='paper'?'live':'paper')}
function go(p){location.hash=p}
function mkChart(el){const c=echarts.init(el,'dark',{renderer:'canvas'});charts.push(c);return c}
window.addEventListener('resize',()=>charts.forEach(c=>c.resize()));
document.addEventListener('click',e=>{const t=e.target.closest('.tools');document.querySelectorAll('.tools').forEach(x=>{if(x!==t)x.classList.remove('open')})});

// ---------- 状态栏 ----------
function paintStatus(s){
  $('#sess').textContent=s.session+' '+s.now.slice(11,16);
  const on=s.last_loop&&(Date.now()/1000-s.last_loop<60);
  $('#mon').innerHTML=`<span class="dot ${on?'on':''}"></span>${on?'监控 '+s.symbols+' 只':'监控未运行'}${s.last_error?' ⚠':''}`;$('#mon').title=s.last_error||'';
  const p=$('#pend');p.textContent='实盘待确认 '+s.pending;p.classList.toggle('hidden',!s.pending||ACCT=='live');
  const b=$('#nbadge');if(b){b.textContent=s.pending;b.classList.toggle('hidden',!s.pending)}
}
async function status(){try{const s=await api('/api/status');window._st=s;paintStatus(s)}catch(e){}}

// ---------- 两个模式共用的小部件 ----------
const STEP_ST={run:'运行中',done:'今天已完成',wait:'等待时间到',off:'今天不运行'};
function ticker(ov,g){
  const it=ov.indexes.map(i=>`<span><em>${esc(i.name)}</em> <b class="num ${pc(i.pct)}">${f2(i.price)}</b> <span class="num ${pc(i.pct)}">${sg(i.pct)}%</span></span>`);
  if(g&&g.quotes)it.push(`<span class="acc">隔夜外盘 · ${esc(g.summary.mood)}</span>`,...Object.values(g.quotes).map(v=>`<span><em>${esc(v.name)}</em> <span class="num ${pc(v.pct)}">${sg(v.pct)}%</span></span>`));
  const s=it.join('<i>◆</i>')+'<i>◆</i>';return `<div class="ticker"><div class="tk">${s}${s}</div></div>`}
async function loadTicker(){try{const [ov,g]=await Promise.all([api('/api/overview'),api('/api/global').catch(()=>null)]);const e=$('#tick');if(e)e.innerHTML=ticker(ov,g)}catch(e){}}
function feedLink(e){return e.link=='orders'?(ACCT=='paper'?'book':(e.kind=='order'?'orders':'ledger')):e.link}
function feedRow(e){return `<div><span class="t">${e.time.slice(6)}</span><span>${e.icon}</span><div><a href="#${feedLink(e)}" ${e.run_id?`onclick="CUR_RUN=${e.run_id}"`:''} style="color:inherit;text-decoration:none">${esc(e.title)}</a>
  ${e.detail?`<div class="d">${esc(e.detail)}</div>`:''}${(e.lines||[]).map(l=>`<div class="d">${esc(l)}</div>`).join('')}</div></div>`}
function planBar(p){const st=p.stop_loss,tg=p.target,en=p.entry_price;if(!st||!tg||!en||tg<=st)return '';
  const px=en*(1+(p.pnl_pct||0)/100),pos=x=>Math.max(0,Math.min(100,(x-st)/(tg-st)*100));
  return `<div class="pbar" title="白线=现价"><div class="pfill" style="width:${pos(px)}%"></div><i class="pe" style="left:${pos(en)}%"></i><i class="pn" style="left:${pos(px)}%"></i>
   <span class="l">止损 ${f2(st,2)}</span><span class="m" style="left:${pos(en)}%">成本 ${f2(en,2)}</span><span class="rr">目标 ${f2(tg,2)}</span></div>`}
function posCards(s,plans,acct){
  if(!s.positions.length)return `<div class="empty">${acct=='paper'?'空仓中 · AI 在等委员会通过的好机会':'实盘空仓 · 在「持仓对账」里录入你券商里的持仓'}</div>`;
  return s.positions.map(p=>{const pl=plans.find(x=>x.symbol==p.symbol)||{};
   return `<div class="pos"><div class="row"><b class="pn2" onclick="openStock('${p.symbol}')">${esc(p.name)}</b><small class="mute">${p.symbol} · ${p.shares}股 · 成本 ${f2(p.avg_cost,3)} · 现价 ${f2(p.price,3)}</small>
     <span class="r big2 ${pc(p.pnl)}">${sg(p.pnl_pct)}%</span></div>
     <div class="row mute" style="font-size:12px"><span class="${pc(p.pnl)}">浮盈 ${sg(p.pnl)}</span><span>仓位 ${p.weight_pct}%</span><span>今日 <span class="${pc(p.pct_today)}">${sg(p.pct_today)}%</span></span>
      ${pl.held_trading_days!=null?`<span>已持 ${pl.held_trading_days}/${pl.max_hold_days} 天</span>`:''}${pl.run_id?`<a href="#committee" onclick="CUR_RUN=${pl.run_id}">委员会#${pl.run_id}</a>`:'<span class="tag">无持仓计划</span>'}
      ${(pl.triggered_today||[]).map(k=>'<span class="tag wait">今日触发:'+esc(k)+'</span>').join('')}
      <span class="r">${pl.symbol?`<button class="sm" onclick="editStop('${acct}','${p.symbol}',${pl.stop_loss||0})">改止损</button>`:''}${acct=='paper'&&p.sellable?` <button class="sm" onclick="quickSell('${p.symbol}',${p.sellable})">手动卖出</button>`:''}</span></div>
     ${planBar(pl)}${pl.thesis?`<div class="mute" style="font-size:12px">💡 ${esc(pl.thesis)}</div>`:''}
     ${(pl.watch_points||[]).length?`<div style="font-size:12px" class="acc">👁 ${pl.watch_points.map(esc).join('；')}</div>`:''}</div>`}).join('')}
function tradeTable(ts){return `<div class="scroll"><table><tr><th>时间</th><th>股票</th><th>方向</th><th class="n">价格</th><th class="n">数量</th><th class="n">费用</th><th class="n">盈亏</th><th>来源</th></tr>
  ${ts.map(t=>`<tr title="${esc(t.note)}"><td class="mute">${t.ts_str}</td><td>${esc(t.name)}</td><td>${SIDE[t.side]}</td><td class="n">${f2(t.price,3)}</td><td class="n">${t.shares}</td><td class="n">${f2(t.fee)}</td><td class="n ${pc(t.pnl)}">${t.pnl==null?'':sg(t.pnl)}</td><td><span class="tag">${{ai:'AI',plan:'持仓计划',rule:'规则',manual:'手动'}[t.source]||esc(t.source)}</span></td></tr>`).join('')||'<tr><td colspan=8 class="empty">暂无成交</td></tr>'}</table></div>`}
// ================= 🛰 模拟盘：AI 驾驶舱 =================
async function pageCockpit(first){
  const [ov,ap,tl,pl]=await Promise.all([api('/api/overview'),api('/api/autopilot?account=paper'),api('/api/timeline?account=paper&days=3'),api('/api/plans').catch(()=>({active:[]}))]);
  const s=ov.accounts.paper,on=ap.ai_accounts.includes('paper'),t=ap.today;
  if(first||!$('#ck')){
    $('#app').innerHTML=`<div id="tick">${ticker(ov,null)}</div>
     <section class="hero" id="ck"><div class="orb" id="orb"><div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div><div class="core"><b id="orbT">--</b><small id="orbS"></small></div></div>
       <div class="hnums" id="hnums"></div><div class="hside" id="hside"></div></section>
     <section class="card" id="pipe"></section>
     <div class="grid g21" style="margin-top:14px"><div><div class="card"><h3>🎯 AI 持仓 · 按计划自动盯盘（止损 ←→ 目标） <a class="r" href="#book">战绩 →</a></h3><div id="ckpos"></div></div>
         <div class="card" style="margin-top:14px"><h3>📈 资产曲线</h3><div id="eq" class="chart" style="height:280px"></div></div></div>
       <div class="card"><h3>📡 AI 实时动态 <a class="r" href="#feed">全部 →</a></h3><div class="tl" id="ckfeed"></div></div></div>`;
    drawEq('paper');loadTicker();
  }
  const iv=(ap.steps[1]||{}).when||'';
  const st=!on?['paused','已暂停','AI 不自动交易']:!ap.llm_enabled?['paused','未接模型','设置里开启内置大模型']
    :ap.market_open?['live','巡检中',iv.replace('交易时段','')]:['idle','待命',ap.phase_note||'等待监控更新'];
  $('#orb').className='orb '+st[0];$('#orbT').textContent=st[1];$('#orbS').textContent=st[2];
  $('#hnums').innerHTML=`<small>模拟盘总资产 · 虚拟资金</small><div class="mega">${money(s.equity)}</div>
    <div class="row" style="gap:20px"><span>累计 <b class="num ${pc(s.total_pnl)}">${sg(s.total_pnl)} (${sg(s.total_pnl_pct)}%)</b></span><span>今日 <b class="num ${pc(s.day_pnl)}">${sg(s.day_pnl)} (${sg(s.day_pnl_pct)}%)</b></span></div>
    <div class="row mute" style="gap:18px;font-size:12px;margin-top:4px"><span>可用 ${money(s.cash)}</span><span>持仓 ${money(s.market_value)}</span><span>${s.positions.length} 只股票</span></div>`;
  $('#hside').innerHTML=`<div class="stat"><b>${t.decisions}</b><small>今日 AI 巡检</small></div><div class="stat"><b>${t.committee}<em>/${t.approved}</em></b><small>委员会 / 通过</small></div>
    <div class="stat"><b>${t.trades_paper}</b><small>今日成交</small></div>
    <span class="tag ${on?'ok':'wait'}">${on?'自动驾驶 · 开':'自动驾驶 · 已暂停'}</span>`;
  $('#pipe').innerHTML=`<h3>⚙ 每天自动运行的流程 <span class="mute r">全部自动，你不用点任何按钮</span></h3>
    <div class="flow">${ap.steps.map((x,i)=>`<div class="node ${x.state}"><div class="nd">${x.state=='done'?'✓':i+1}</div><b>${esc(x.name)}</b><small>${esc(x.when)}</small><div class="st">${STEP_ST[x.state]}</div><small>${esc(x.note)}</small></div>`).join('')}</div>`;
  $('#ckfeed').innerHTML=tl.slice(0,8).map(feedRow).join('')||'<div class="empty" style="display:block">还没有动态 · 交易日 9:00 后 AI 开始工作</div>';
  $('#ckpos').innerHTML=posCards(s,pl.active.filter(p=>p.account=='paper'),'paper');
}

// 模拟盘：持仓战绩
async function pageBook(){
  const [ov,pl,ts]=await Promise.all([api('/api/overview'),api('/api/plans').catch(()=>({active:[],closed:[]})),api('/api/trades?account=paper')]);
  const s=ov.accounts.paper,closed=(pl.closed||[]).filter(c=>c.account=='paper');
  const rp=c=>(c.outcome||{}).realized_pnl||0,wins=closed.filter(c=>rp(c)>0).length,tot=closed.reduce((a,c)=>a+rp(c),0);
  const avgDays=closed.length?closed.reduce((a,c)=>a+((c.outcome||{}).held_days||0),0)/closed.length:0;
  $('#app').innerHTML=`<div class="bstat" style="margin-bottom:14px">
     <div><small>已完成的波段</small><b>${closed.length}</b></div><div><small>胜率</small><b class="${closed.length?(wins/closed.length>=.5?'up':'down'):''}">${closed.length?Math.round(wins/closed.length*100)+'%':'--'}</b></div>
     <div><small>已实现盈亏</small><b class="${pc(tot)}">${sg(tot)}</b></div><div><small>平均持有</small><b>${closed.length?f2(avgDays,1)+'天':'--'}</b></div></div>
   <div class="card"><h3>🎯 当前持仓（${s.positions.length}）</h3>${posCards(s,pl.active.filter(p=>p.account=='paper'),'paper')}</div>
   <div class="grid g2" style="margin-top:14px"><div class="card"><h3>🏁 已结束的波段</h3><div class="list">${closed.map(c=>`<div class="row"><b>${esc(c.name)}</b><small class="mute">${c.symbol} · 持有 ${(c.outcome||{}).held_days??'-'} 天 · 卖出价 ${f2((c.outcome||{}).exit_price,3)}</small>
      ${c.run_id?`<a class="tag" href="#committee" onclick="CUR_RUN=${c.run_id}">委员会#${c.run_id}</a>`:''}<span class="r big2 ${pc(rp(c))}" style="font-size:16px">${sg(rp(c))} <small>(${sg((c.outcome||{}).return_pct)}%)</small></span></div>`).join('')||'<div class="empty">还没有完整的一次买卖</div>'}</div></div>
    <div class="card"><h3>🧾 成交流水</h3>${tradeTable(ts)}</div></div>
   <div class="grid g2" style="margin-top:14px"><div class="card"><h3>🩺 能不能上实盘 <span class="mute r">模拟盘体检</span></h3><div id="rvCheck" class="mute">计算中…</div></div>
    <div class="card"><h3>🔍 委员会事后对账 <span class="mute r">近 30 天，被否的票后来怎么样了</span></h3><div id="rvOut" class="mute">计算中…</div></div></div>`;
  api('/api/review?account=paper').then(r=>{if(page!='book')return;const k=r.check,o=r.outcomes,st=o.stats;
    $('#rvCheck').innerHTML=`<div style="margin-bottom:8px"><b class="${k.ready?'up':''}">${esc(k.advice)}</b></div>${k.checks.map(c=>`<div class="row"><span>${c.ok?'✅':'⬜'} ${esc(c.name)}</span><span class="r num">${esc(c.value)}</span></div>`).join('')}
      ${k.closed?`<div class="mute" style="margin-top:6px">胜率 ${k.win_rate}% · 平均每笔 ${sg(k.avg_pnl)}</div>`:''}`;
    const P=x=>x==null?'--':`<span class="${pc(x)}">${sg(x)}%</span>`;
    const row=(k,l)=>st[k].n?`<tr><td>${l}</td><td class="n">${st[k].n}</td><td class="n">${P(st[k].avg_ret1)}</td><td class="n">${P(st[k].avg_ret3)}</td><td class="n">${P(st[k].avg_ret5)}</td><td class="n">${st[k].hit_up8}</td></tr>`:'';

    <div class="card"><h3>资金曲线 <small class="mute" id="btname"></small></h3><div id="btc" class="chart"></div><h3 style="margin-top:10px">最近成交</h3><div id="btlog" class="list" style="max-height:260px;overflow:auto"></div></div></div>`;

// 模型下拉框：预设 + 自定义（隐藏的 input 才是真正保存的字段）
const MODELS=[['deepseek-flash','DeepSeek V4.1 Flash（推荐·快·便宜）','https://api.deepseek.com'],
  ['deepseek-v4-pro','DeepSeek V4 Pro（更强·约贵3倍）','https://api.deepseek.com']];
function modelSel(key,val,allowSame){
  val=val||'';const known=MODELS.some(m=>m[0]==val)||(allowSame&&val=='');
  const opts=(allowSame?[['','同上（和决策模型一样）']]:[]).concat(MODELS.map(m=>[m[0],m[1]]));
  return `<div class="row" style="flex-wrap:nowrap"><select id="sel_${key}" onchange="pickModel('${key}')" style="flex:1">
    ${opts.map(([v,l])=>`<option value="${v}" ${known&&v==val?'selected':''}>${l}</option>`).join('')}
    <option value="__custom" ${known?'':'selected'}>自定义…</option></select>
    <input type="text" data-sec="ai" data-k="${key}" id="in_${key}" value="${esc(val)}" placeholder="模型名，如 qwen-plus"
      style="flex:1;${known?'display:none':''}"></div>`}
function pickModel(key){const v=$('#sel_'+key).value,inp=$('#in_'+key);
  if(v=='__custom'){inp.style.display='';inp.value='';inp.focus();return}
  inp.style.display='none';inp.value=v;
  const m=MODELS.find(x=>x[0]==v);const url=document.querySelector('[data-sec="ai"][data-k="llm_base_url"]');
  if(m&&key=='llm_model'&&url)url.value=m[2]}
async function saveCfg(){const p={};document.querySelectorAll('[data-sec]').forEach(i=>{const s=i.dataset.sec,k=i.dataset.k;p[s]=p[s]||{};
  p[s][k]=i.type=='checkbox'?i.checked:(i.type=='number'?+i.value:i.value)});
  p.ai.accounts=[...($('#ai_paper').checked?['paper']:[]),...($('#ai_live').checked?['live']:[])];
  p.universe=p.universe||{};p.universe.boards=[...document.querySelectorAll('.board:checked')].map(x=>x.value);
  p.regime={caps:{}};document.querySelectorAll('.cap').forEach(i=>p.regime.caps[i.dataset.k]=+i.value);
  if(document.querySelector('.nkind')){p.notify=p.notify||{};p.notify.kinds={};document.querySelectorAll('.nkind').forEach(i=>p.notify.kinds[i.dataset.k]=i.checked)}
  if(document.querySelector('.akind')){p.notify=p.notify||{};const K={};document.querySelectorAll('.akind').forEach(i=>K[i.dataset.k]=i.checked);
    p.notify.accounts={[ACCT]:{enabled:$('#acct_push_on').checked,kinds:K}}}
  await post('/api/config',p);toast('已保存');status()}
let WXT=null;
async function wxbotLoad(){const el=$('#wxbot');if(!el)return;let s;try{s=await api('/api/wechat/status')}catch(e){el.innerHTML='<div class="mute">读取失败</div>';return}
  const L=s.login||{};clearTimeout(WXT);
  if(s.bound){el.innerHTML=`<div class="form"><label>状态</label><div>✅ 已绑定（${esc(s.bound_at||'')}）${s.running?'':' <span class="down">收消息线程没在跑</span>'}</div>
    <label>会话剩余</label><div>${s.session_left_hours==null?'还没收到你的消息：请先在微信里给它发一句「帮助」':(s.session_left_hours>0?s.session_left_hours+' 小时（你上次说话 '+esc(s.last_user_msg)+'）':'<span class="up">已过期，提醒改走 PushPlus；在微信里回一句就恢复</span>')}</div>
    <label>主动提醒</label><div>本轮已用 ${s.pushes_used}/${s.max_push} 条（你每说一句话就重新计数）</div>
    ${s.last_error?`<label>最近问题</label><div class="mute">${esc(s.last_error)}</div>`:''}
    <span></span><div class="row"><button onclick="wxbotTest()">发测试提醒</button><button class="red" onclick="wxbotUnbind()">解绑</button></div></div>
    <p class="mute"><small>在微信里可以发：持仓、订单、确认 12、拒绝 12、审 600519，或直接提问。微信规定：你 24 小时不说话，机器人就不能主动发消息；你每说一句话后最多主动发 10 条（这里用 9 条）。发不了时自动改走 PushPlus。</small></p>`;return}
  el.innerHTML=`<div style="padding:4px 2px">
    ${L.qr_svg?`<div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap"><div style="width:200px;height:200px;background:#fff;border-radius:8px;padding:6px">${L.qr_svg}</div>
      <div><b>用 iPhone 微信扫这个码</b><div class="mute" style="margin:6px 0">${esc(L.message||'')}</div>
      ${L.status=='need_verifycode'?`<div class="row"><input id="wxcode" placeholder="手机上显示的数字" style="width:140px"><button class="pri" onclick="wxbotVerify()">提交</button></div>`:''}</div></div>`
    :`<div class="mute" style="margin-bottom:8px">${esc(L.message||'还没绑定。绑定后微信里会多一个对话框：系统提醒发到这里，你也能直接提问、确认订单。')}</div>
      <button class="pri" onclick="wxbotLogin()">绑定微信</button>`}
    <p class="mute"><small>需要 iPhone 微信 8.0.70 以上：「我 → 设置 → 插件 → ClawBot」能看到才能用。只有扫码的这个微信号能跟系统对话。</small></p></div>`;
  if(L.qr_svg||L.status=='scaned')WXT=setTimeout(wxbotLoad,2500)}
async function wxbotLogin(){await post('/api/wechat/login');wxbotLoad()}

// ---------- 路由 ----------
const PAGES={cockpit:[pageCockpit,10000],book:[pageBook,15000],desk:[pageDesk,8000],ledger:[pageLedger,0],feed:[pageFeed,15000],
  watch:[pageWatch,3000],screen:[pageScreen,0],committee:[pageCommittee,3000],rules:[pageRules,0],strategies:[pageStrategies,0],
  backtest:[pageBacktest,0],ai:[pageAI,30000],orders:[pageOrders,8000],settings:[pageSettings,0]};
const KEEP=['watch','cockpit','desk'];   // 这些页面局部刷新，不销毁图表
async function render(first){const [fn]=PAGES[page];if(!first&&!KEEP.includes(page)){charts.forEach(c=>c.dispose());charts=[]}try{await fn(first)}catch(e){console.error(e)}}
function route(){
  let p=location.hash.slice(1);const home=MODES[ACCT].home;
  if(!PAGES[p]||p=='dash'){if(location.hash.slice(1)!==home){location.replace('#'+home);return}p=home}
  // 属于另一个模式的页面 → 回到当前模式首页（每个页面只为一个模式服务）
  const other=ACCT=='paper'?'live':'paper';
  if(MODE_PAGES[other].includes(p)&&!MODE_PAGES[ACCT].includes(p)){location.replace('#'+home);return}
  page=p;applyMode();document.querySelectorAll('.tools').forEach(x=>x.classList.remove('open'));
  const a=$('#app');a.classList.remove('enter');void a.offsetWidth;a.classList.add('enter');
  charts.forEach(c=>c.dispose());charts=[];clearInterval(timer);
  render(true).then(()=>{if(page=='watch'&&stockSym)openStock(stockSym)});
  const iv=PAGES[page][1];if(iv)timer=setInterval(()=>{if(!document.hidden&&!document.activeElement.matches('input,textarea,select'))render(false)},iv)}
window.addEventListener('hashchange',route);route();status();setInterval(status,5000);
</script>
