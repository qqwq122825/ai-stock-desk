<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>登录 · AI 量化决策台</title>
<style>
:root{--bg:#0d1117;--panel:#151b23;--line:#2a3442;--text:#e6edf3;--mute:#8b98a8;--accent:#e9b949;--up:#f0475a}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--text);
  font:14px/1.5 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;padding:16px}
.box{width:100%;max-width:340px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:28px 24px}
h1{margin:0 0 4px;font-size:18px}h1 b{color:var(--accent)}
p{margin:0 0 20px;color:var(--mute);font-size:13px}
input{width:100%;background:#0b0f14;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:15px}
input:focus{outline:none;border-color:var(--accent)}
button{width:100%;margin-top:14px;background:var(--accent);color:#111;border:0;border-radius:8px;padding:10px;font-size:15px;font-weight:600;cursor:pointer}
button:disabled{opacity:.6}
#err{color:var(--up);font-size:13px;min-height:20px;margin-top:10px}
</style>
</head>
<body>
<form class="box" id="f">
  <h1>AI <b>量化</b>决策台</h1>
  <p>请输入后台密码</p>
  <input type="password" id="pw" placeholder="密码" autocomplete="current-password" autofocus>
  <button id="btn">登录</button>
  <div id="err"></div>
</form>
<script>
document.getElementById('f').onsubmit=async e=>{
  e.preventDefault();const btn=document.getElementById('btn'),err=document.getElementById('err');
  btn.disabled=true;err.textContent='';
  try{
    const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.getElementById('pw').value})});
    const j=await r.json().catch(()=>({}));
    if(r.ok){const next=new URLSearchParams(location.search).get('next')||'/';location.href=next.startsWith('/')?next:'/';return}
    err.textContent=j.error||('登录失败 '+r.status);
  }catch(x){err.textContent='网络错误'}
  btn.disabled=false;
};
</script>
</body>
</html>
